name: k6 load test

# TEST_AUTOMATION_ROADMAP.md §7.2/§8 Phase 5 : charge sur /sejours (recherche),
# JAMAIS sur push/pull_request (délibérément absent des triggers ci-dessous —
# workflow séparé de ci.yml pour ça, pas un `if:` sur un trigger partagé, afin
# de ne courir aucun risque de le déclencher par erreur sur une PR). Nightly/
# hebdo + relançable manuellement, cf. §7.4 (job isolé, relançable seul).
on:
  schedule:
    - cron: "0 3 * * 1" # lundi 03:00 UTC
  workflow_dispatch:

jobs:
  k6:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: darna
          POSTGRES_USER: darna
          POSTGRES_PASSWORD: darna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darna"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://darna:darna@localhost:5432/darna
      DIRECT_URL: postgresql://darna:darna@localhost:5432/darna
      AUTH_SECRET: ci-only-dummy-secret-do-not-use-in-prod
      SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed (annonces réalistes pour la charge de recherche)
        run: npx prisma db seed

      - name: Build (production — next dev fausserait complètement les p95)
        run: npm run build

      - name: Démarrer le serveur en arrière-plan
        run: |
          nohup npx next start > next-start.log 2>&1 &
          echo $! > server.pid

      - name: Attendre que le serveur soit prêt
        run: |
          for i in $(seq 1 30); do
            if curl -sS -o /dev/null http://localhost:3000; then
              echo "Serveur prêt."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Le serveur next start n'a jamais répondu."
          cat next-start.log
          exit 1

      - name: Installer k6
        uses: grafana/setup-k6-action@v1

      - name: k6 — charge de recherche (/sejours)
        run: k6 run --summary-export=k6-summary.json tests/k6/search-load.js

      - name: Rapport de charge (page du run)
        if: always()
        run: node scripts/k6-summary.mjs k6-summary.json

      - name: Upload rapport k6 (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-report
          path: k6-summary.json
          retention-days: 14

      - name: Arrêter le serveur
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
