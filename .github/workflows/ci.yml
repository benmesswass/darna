name: CI

# Pyramide de jobs (ROADMAP.md §P1.2) :
#   - `fast` (niveau 1) : chaque push / mise à jour de PR — lint + typecheck +
#     tests sans couverture, cible < 5 min.
#   - `full`/`e2e`/`api` (niveau 2) : à la demande (`workflow_dispatch`) ou
#     quand le label `ready-to-merge` est posé sur la PR — coverage + build +
#     audit + e2e + api. Règle de merge : `fast` ET `full`/`e2e`/`api` verts
#     sur le commit de tête (voir CLAUDE.md §Workflow PR).
#   - Niveau 3 (semgrep + ZAP + k6, nightly) : voir `nightly.yml`, jamais ici.
# `paths-ignore` sur push/pull_request : une grosse part des PR du projet
# sont des PR de roadmap (*.md) — zéro CI consommée pour ça.
on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Niveau 1 : tourne sur tout push/màj de PR, SAUF quand l'événement
  # déclencheur est juste l'ajout d'un label (cf. job `full` ci-dessous) —
  # un simple label ne change pas le code, inutile de relancer `fast`.
  fast:
    if: github.event_name != 'pull_request' || github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (sans couverture)
        run: npx vitest run

  # Niveau 2 : coverage + build + audit. Ne relance PAS lint/typecheck
  # (déjà couverts par `fast` sur ce même commit de tête).
  full:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ready-to-merge')
    runs-on: ubuntu-latest

    # Postgres jetable : permet `migrate deploy` (valide en continu la migration
    # de rattrapage) et le `next build` (génération du sitemap qui lit la DB).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: darna
          POSTGRES_USER: darna
          POSTGRES_PASSWORD: darna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darna"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://darna:darna@localhost:5432/darna
      # Pas de pooler en CI : connexion directe = DATABASE_URL (requis par le
      # `directUrl` du schema pour `prisma migrate deploy`).
      DIRECT_URL: postgresql://darna:darna@localhost:5432/darna
      # Secret factice CI (≥ 32 car.) — jamais un vrai secret.
      AUTH_SECRET: ci-only-dummy-secret-do-not-use-in-prod
      SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations (vérifie l'absence de dérive)
        run: npx prisma migrate deploy

      - name: Tests + couverture (chemins critiques — paiement, booking, concurrence)
        # `test:coverage` applique le gate de couverture (seuils vitest.config.ts)
        # ET exécute les tests d'intégration sur la vraie base (DATABASE_URL du
        # service Postgres ci-dessus) — dont la concurrence anti double-réservation.
        # Le reporter `github-actions` (activé via GITHUB_ACTIONS) annote les
        # tests échoués directement dans la PR.
        run: npm run test:coverage

      - name: Rapport de tests détaillé (page du run)
        # Publie LE rapport détaillé dans $GITHUB_STEP_SUMMARY (§7.3 de la
        # roadmap) : tous les tests (par fichier + détail replié), échecs avec
        # message, totaux et couverture. `if: always()` → visible même sur échec.
        if: always()
        run: node scripts/ci-test-summary.mjs

      - name: Upload rapport de couverture (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build
        run: npm run build

      - name: Audit (bloque sur faille haute/critique)
        run: npm audit --audit-level=high

  # Job isolé (§7.4 TEST_AUTOMATION_ROADMAP.md) : pas de `needs: full` — reste
  # relançable indépendamment même si `full` échoue ou n'a pas encore tourné.
  e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ready-to-merge')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: darna
          POSTGRES_USER: darna
          POSTGRES_PASSWORD: darna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darna"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://darna:darna@localhost:5432/darna
      DIRECT_URL: postgresql://darna:darna@localhost:5432/darna
      AUTH_SECRET: ci-only-dummy-secret-do-not-use-in-prod
      SITE_URL: http://localhost:3000
      # Gating KYC activé exprès (scénario 07-kyc-gating.spec.ts) — les autres
      # comptes seedés sont déjà VERIFIE/DEMO_VERIFIE et ne sont pas bloqués.
      KYC_GATING: "on"
      # Mot de passe factice partagé par les comptes seedés (jamais un vrai secret).
      E2E_TEST_PASSWORD: e2e-ci-only-dummy-password-2026

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: npm run test:e2e

      - name: Générer le rapport Allure
        # --single-file : un unique index.html autonome, ouvrable directement
        # (double-clic) sans serveur local ni souci CORS/fetch.
        if: always()
        run: npx allure generate allure-results --single-file --clean -o allure-report

      - name: Upload rapport Allure (artifact)
        if: always()
        id: allure-artifact
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Lien direct vers le rapport Allure (résumé du run)
        # Publié dans $GITHUB_STEP_SUMMARY (même esprit que §7.3) : le lien de
        # téléchargement apparaît en haut de la page du run, pas enfoui dans
        # l'onglet Artifacts.
        if: always()
        run: |
          {
            echo "## 🧪 Rapport E2E (Allure)"
            echo ""
            echo "**[📊 Télécharger le rapport Allure](${{ steps.allure-artifact.outputs.artifact-url }})**"
            echo ""
            echo "En local, \`npm run report:e2e\` télécharge et ouvre automatiquement le"
            echo "dernier rapport (compte gh personnel requis — repo privé)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload traces/vidéos Playwright (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

  # Job isolé (§7.4), indépendant de `e2e` : tester les portes de
  # /api/payments/konnect/webhook (400/401/429) exige PAYMENT_MODE=konnect
  # actif sur ce serveur — incompatible avec `e2e` qui dépend du paiement
  # démo (Konnect désactivé, cf. scénario 02). Un seul `next dev` ne peut pas
  # avoir les deux valeurs en même temps, d'où un serveur/job dédié.
  api:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ready-to-merge')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: darna
          POSTGRES_USER: darna
          POSTGRES_PASSWORD: darna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darna"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://darna:darna@localhost:5432/darna
      DIRECT_URL: postgresql://darna:darna@localhost:5432/darna
      AUTH_SECRET: ci-only-dummy-secret-do-not-use-in-prod
      SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: API (Playwright, sans navigateur)
        # PAYMENT_MODE/KONNECT_* sont injectés par playwright.api.config.ts
        # (webServer.env) — identifiants factices, jamais de vraie clé.
        run: npm run test:api

      - name: Générer le rapport Allure
        if: always()
        run: npx allure generate allure-results-api --single-file --clean -o allure-report-api

      - name: Upload rapport Allure (artifact)
        if: always()
        id: allure-artifact-api
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-api
          path: allure-report-api/
          retention-days: 14

      - name: Lien direct vers le rapport Allure (résumé du run)
        if: always()
        run: |
          {
            echo "## 🧪 Rapport API (Allure)"
            echo ""
            echo "**[📊 Télécharger le rapport Allure](${{ steps.allure-artifact-api.outputs.artifact-url }})**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload traces (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-traces
          path: test-results/
          retention-days: 14
