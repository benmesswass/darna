name: CI

# Pyramide de jobs (ROADMAP.md §P1.2) :
#   - `fast` (niveau 1) : chaque push / mise à jour de PR — lint + typecheck +
#     tests sans couverture, cible < 5 min.
#   - `full`/`e2e`/`api`/`supply-chain` (niveau 2) : à la demande
#     (`workflow_dispatch`) ou quand le label `ready-to-merge` est posé sur la
#     PR — coverage + build + audit + e2e + api + SBOM/Trivy. Règle de merge :
#     `fast` ET les jobs du niveau 2 verts sur le commit de tête (voir
#     CLAUDE.md §Workflow PR).
#   - Niveau 3 (semgrep + ZAP + k6, nightly) : voir `nightly.yml`, jamais ici.
#   - `migration-gate` (P5.5, ROADMAP.md) : gate indépendant de la pyramide
#     ci-dessus, sur tout événement de PR (y compris `labeled`) — bloque une
#     migration destructive sans le label `migration-approved`. Requis dans
#     « CI verte » au même titre que `fast`/`gitleaks`.
# `paths-ignore` sur push/pull_request : une grosse part des PR du projet
# sont des PR de roadmap (*.md) — zéro CI consommée pour ça.
on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Niveau 1 : tourne sur tout push/màj de PR, SAUF quand l'événement
  # déclencheur est juste l'ajout d'un label (cf. job `full` ci-dessous) —
  # un simple label ne change pas le code, inutile de relancer `fast`.
  fast:
    if: github.event_name != 'pull_request' || github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (sans couverture)
        run: npx vitest run

  # P2.1 (ROADMAP.md) : scanne tout l'historique de la PR à la recherche de
  # secrets commis. Action officielle, licence gratuite hors repo
  # d'organisation (ce dépôt appartient à un compte personnel). Faux positif
  # connu allowlisté dans .gitleaks.toml (fixture de test crypto.test.ts).
  gitleaks:
    if: github.event_name != 'pull_request' || github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Gate migration (P5.5, ROADMAP.md) : bloque toute migration Prisma
  # potentiellement destructive (DROP TABLE/COLUMN, ALTER COLUMN, TRUNCATE,
  # DROP DATABASE/SCHEMA) tant que la PR ne porte pas le label
  # `migration-approved`. Contrairement à `fast`/`gitleaks` ci-dessus (qui
  # sautent l'événement `labeled` car un label ne change pas le code), CE
  # job doit au contraire tourner sur `labeled` : c'est précisément l'ajout
  # du label qui fait passer le job d'échec à succès. Zéro dépendance npm
  # (script Node builtins uniquement) : pas de `npm ci`, job très rapide.
  migration-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Vérifie l'absence de migration destructive non approuvée
        env:
          MIGRATION_GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MIGRATION_GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MIGRATION_GATE_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/check-destructive-migrations.mjs

  # Niveau 2 : coverage + build + audit. Ne relance PAS lint/typecheck
  # (déjà couverts par `fast` sur ce même commit de tête). `test:coverage`
  # inclut le projet Vitest `integration` (ROADMAP.md §P2.5, tests contre le
  # Postgres jetable ci-dessous) — même service, aucun job dédié nécessaire.
  full:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ready-to-merge')
    runs-on: ubuntu-latest

    # Postgres jetable : permet `migrate deploy` (valide en continu la migration
    # de rattrapage) et le `next build` (génération du sitemap qui lit la DB).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: darna
          POSTGRES_USER: darna
          POSTGRES_PASSWORD: darna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darna"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://darna:darna@localhost:5432/darna
      # Pas de pooler en CI : connexion directe = DATABASE_URL (requis par le
      # `directUrl` du schema pour `prisma migrate deploy`).
      DIRECT_URL: postgresql://darna:darna@localhost:5432/darna
      # Secret factice CI (≥ 32 car.) — jamais un vrai secret.
      AUTH_SECRET: ci-only-dummy-secret-do-not-use-in-prod
      SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations (vérifie l'absence de dérive)
        run: npx prisma migrate deploy

      - name: Tests + couverture (chemins critiques — paiement, booking, concurrence)
        # `test:coverage` applique le gate de couverture (seuils vitest.config.ts)
        # ET exécute les tests d'intégration sur la vraie base (DATABASE_URL du
        # service Postgres ci-dessus) — dont la concurrence anti double-réservation.
        # Le reporter `github-actions` (activé via GITHUB_ACTIONS) annote les
        # tests échoués directement dans la PR.
        run: npm run test:coverage

      - name: Rapport de tests détaillé (page du run)
        # Publie LE rapport détaillé dans $GITHUB_STEP_SUMMARY (§7.3 de la
        # roadmap) : tous les tests (par fichier + détail replié), échecs avec
        # message, totaux et couverture. `if: always()` → visible même sur échec.
        if: always()
        run: node scripts/ci-test-summary.mjs

      - name: Upload rapport de couverture (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build
        run: npm run build

      # --omit=dev : le gate protège le code EXPÉDIÉ (dependencies), jamais
      # l'outillage de développement (devDependencies — eslint, vitest,
      # playwright...) qui ne touche jamais le bundle ni le runtime servi
      # aux utilisateurs. Décision du 2026-07-31 (ROADMAP.md §2.1) après
      # qu'un run réel a bloqué sur 9 failles hautes 100 % confinées à la
      # chaîne interne d'ESLint (brace-expansion via minimatch, exploitée par
      # @eslint/config-array et @eslint/eslintrc) : la seule vraie correction
      # est le bump ESLint 10, qui exige `eslint-config-next` 16.x (donc
      # Next 16), déjà identifié comme un chantier dédié (P8.1, ~38 erreurs
      # "Rules of React" sur ~30 fichiers), pas un correctif de sécurité
      # ponctuel. Une tentative de correction ciblée (overrides brace-expansion
      # seul, sans le reste) casse ESLint 9 en direct (l'API de brace-expansion
      # change de forme entre les deux lignes majeures) — vérifié localement,
      # pas une hypothèse. `npm audit --omit=dev` reproduit exactement ce que
      # verrait un utilisateur final de l'app déployée.
      - name: Audit (bloque sur faille haute/critique, dépendances de prod)
        run: npm audit --omit=dev --audit-level=high

  # P5.6 (ROADMAP.md) : complète `npm audit --audit-level=high` (job `full`)
  # par un SBOM (inventaire exhaustif des dépendances, format CycloneDX,
  # généré nativement par npm ≥ 9, aucune dépendance supplémentaire) et un
  # scan de vulnérabilités indépendant (Trivy — base de données distincte de
  # celle de npm/GitHub, réduit le risque d'angle mort d'une source unique).
  # Aucune image Docker dans ce projet (déploiement Vercel, pas de
  # Dockerfile) : le scan porte sur le système de fichiers (`fs`), pas une
  # image de conteneur. Job isolé, pas de `needs:`, même déclenchement que
  # `full`/`e2e`/`api`.
  supply-chain:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ready-to-merge')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Génère le SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload SBOM (artifact)
        # if: always() : le SBOM (inventaire, pas un verdict) reste utile même
        # si l'étape Trivy suivante fait échouer le job.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 14

      - name: Scan de vulnérabilités (Trivy, filesystem)
        # scanners: vuln seul (pas secret/misconfig) : gitleaks couvre déjà
        # les secrets (job dédié ci-dessus), zéro chevauchement voulu.
        # severity HIGH,CRITICAL : même seuil que `npm audit --audit-level=high`.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: node_modules

  # Job isolé (§7.4 TEST_AUTOMATION_ROADMAP.md) : pas de `needs: full` — reste
  # relançable indépendamment même si `full` échoue ou n'a pas encore tourné.
  e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ready-to-merge')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: darna
          POSTGRES_USER: darna
          POSTGRES_PASSWORD: darna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darna"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://darna:darna@localhost:5432/darna
      DIRECT_URL: postgresql://darna:darna@localhost:5432/darna
      AUTH_SECRET: ci-only-dummy-secret-do-not-use-in-prod
      SITE_URL: http://localhost:3000
      # Gating KYC activé exprès (scénario 07-kyc-gating.spec.ts) — les autres
      # comptes seedés sont déjà VERIFIE/DEMO_VERIFIE et ne sont pas bloqués.
      KYC_GATING: "on"
      # Mot de passe factice partagé par les comptes seedés (jamais un vrai secret).
      E2E_TEST_PASSWORD: e2e-ci-only-dummy-password-2026

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: npm run test:e2e

      - name: Générer le rapport Allure
        # --single-file : un unique index.html autonome, ouvrable directement
        # (double-clic) sans serveur local ni souci CORS/fetch.
        if: always()
        run: npx allure generate allure-results --single-file --clean -o allure-report

      - name: Upload rapport Allure (artifact)
        if: always()
        id: allure-artifact
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Lien direct vers le rapport Allure (résumé du run)
        # Publié dans $GITHUB_STEP_SUMMARY (même esprit que §7.3) : le lien de
        # téléchargement apparaît en haut de la page du run, pas enfoui dans
        # l'onglet Artifacts.
        if: always()
        run: |
          {
            echo "## 🧪 Rapport E2E (Allure)"
            echo ""
            echo "**[📊 Télécharger le rapport Allure](${{ steps.allure-artifact.outputs.artifact-url }})**"
            echo ""
            echo "En local, \`npm run report:e2e\` télécharge et ouvre automatiquement le"
            echo "dernier rapport (compte gh personnel requis — repo privé)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload traces/vidéos Playwright (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

  # Job isolé (§7.4), indépendant de `e2e` : tester les portes de
  # /api/payments/konnect/webhook (400/401/429) exige PAYMENT_MODE=konnect
  # actif sur ce serveur — incompatible avec `e2e` qui dépend du paiement
  # démo (Konnect désactivé, cf. scénario 02). Un seul `next dev` ne peut pas
  # avoir les deux valeurs en même temps, d'où un serveur/job dédié.
  api:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ready-to-merge')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: darna
          POSTGRES_USER: darna
          POSTGRES_PASSWORD: darna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darna"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://darna:darna@localhost:5432/darna
      DIRECT_URL: postgresql://darna:darna@localhost:5432/darna
      AUTH_SECRET: ci-only-dummy-secret-do-not-use-in-prod
      SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: API (Playwright, sans navigateur)
        # PAYMENT_MODE/KONNECT_* sont injectés par playwright.api.config.ts
        # (webServer.env) — identifiants factices, jamais de vraie clé.
        run: npm run test:api

      - name: Générer le rapport Allure
        if: always()
        run: npx allure generate allure-results-api --single-file --clean -o allure-report-api

      - name: Upload rapport Allure (artifact)
        if: always()
        id: allure-artifact-api
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-api
          path: allure-report-api/
          retention-days: 14

      - name: Lien direct vers le rapport Allure (résumé du run)
        if: always()
        run: |
          {
            echo "## 🧪 Rapport API (Allure)"
            echo ""
            echo "**[📊 Télécharger le rapport Allure](${{ steps.allure-artifact-api.outputs.artifact-url }})**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload traces (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-traces
          path: test-results/
          retention-days: 14
