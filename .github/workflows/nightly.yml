name: Nightly (sécurité & perf)

# Niveau 3 de la pyramide CI (ROADMAP.md §P1.2) : semgrep (SAST) +
# ZAP baseline (DAST passif) + k6 (perf/charge) — jamais sur push/pull_request,
# uniquement nightly + déclenchement manuel. Fusion de zap-baseline.yml et
# perf.yml : mêmes jobs, même contenu, un seul fichier/planning pour tout le
# niveau 3. `schedule` ne se déclenche que sur la branche par défaut (`main`)
# — pas besoin de garde supplémentaire.
on:
  schedule:
    - cron: "0 3 * * *" # tous les jours à 03:00 UTC
  workflow_dispatch:

jobs:
  # Job léger — analyse statique, pas de Postgres. Rulesets Semgrep Registry
  # publics (p/...) : gratuits, pas de compte requis. Bloquant (`--error`) :
  # tout nouveau finding fait échouer le job. Anciennement dans ci.yml —
  # déplacé ici (L2.1) pour ne plus peser sur le budget de minutes par push.
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer Semgrep
        run: pip install semgrep

      - name: Semgrep (SAST)
        run: |
          semgrep \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/typescript \
            --config=p/react \
            --config=p/nextjs \
            --exclude=node_modules --exclude=.next --exclude=tests --exclude="*.test.ts" \
            --error --metrics=off \
            src/

  # TEST_AUTOMATION_ROADMAP.md §6.6/§7.2/§8 Phase 5 : scan PASSIF OWASP ZAP
  # (headers/CSP/cookies) — vérifie en boîte noire ce que la phase 2 de ROADMAP.md
  # affirme déjà en code (CSP par nonce, HSTS, X-Frame-Options DENY, nosniff).
  zap-baseline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: darna
          POSTGRES_USER: darna
          POSTGRES_PASSWORD: darna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darna"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://darna:darna@localhost:5432/darna
      DIRECT_URL: postgresql://darna:darna@localhost:5432/darna
      AUTH_SECRET: ci-only-dummy-secret-do-not-use-in-prod
      SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed (pages avec du contenu réel à scanner)
        run: npx prisma db seed

      - name: Build (production — headers/CSP réels, pas next dev)
        run: npm run build

      - name: Démarrer le serveur en arrière-plan
        run: |
          nohup npx next start > next-start.log 2>&1 &
          echo $! > server.pid

      - name: Attendre que le serveur soit prêt
        run: |
          for i in $(seq 1 30); do
            if curl -sS -o /dev/null http://localhost:3000; then
              echo "Serveur prêt."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Le serveur next start n'a jamais répondu."
          cat next-start.log
          exit 1

      - name: ZAP baseline scan
        # continue-on-error : le 1er run réel (2026-07-20) a montré que le
        # SCAN lui-même aboutit et écrit ses rapports (report_html.html/
        # report_json.json/report_md.md à la racine — noms désormais
        # confirmés, plus une supposition) sans AUCUN souci — 387 URLs,
        # 0 FAIL, 59 PASS, 8 catégories WARN — mais que l'étape échoue quand
        # même à cause de l'upload d'artifact INTERNE à l'action ("Create
        # Artifact Container failed... is not valid"), qui cible l'ancienne
        # API Actions Artifacts (v1/v2, api-version=6.0-preview) que GitHub a
        # dépréciée côté serveur — indépendant de fail_action (qui ne gouverne
        # que les findings WARN/FAIL, pas cette erreur d'upload). On ne
        # dépend plus de son upload interne : on récupère les fichiers
        # nous-mêmes juste après, avec actions/upload-artifact@v7 (l'API
        # actuelle, déjà éprouvée dans ci.yml).
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:3000"
          # Scan PASSIF uniquement (aucune attaque active) — cf. roadmap
          # "DAST (Beta+) : scan passif". fail_action=false : seuils/faux
          # positifs pas encore calibrés sur un vrai résultat — un rapport à
          # examiner, pas un gate bloquant (le job entier ne tourne de toute
          # façon jamais sur PR, cf. `on:` ci-dessus).
          fail_action: false
          allow_issue_writing: false

      - name: Rapport ZAP (page du run)
        if: always()
        run: |
          {
            echo "## 🛡️ Rapport ZAP baseline (DAST)"
            echo ""
            if [ -f report_md.md ]; then
              cat report_md.md
            else
              echo "Rapport Markdown introuvable à la racine — voir l'artifact \`zap-report\` (HTML/JSON complets) ou les logs du step \`ZAP baseline scan\` ci-dessus."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rapport ZAP (artifact)
        # Upload par nous-mêmes (API actuelle) plutôt que de dépendre de
        # l'upload interne cassé de l'action — cf. commentaire ci-dessus.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn
          retention-days: 14

      - name: Arrêter le serveur
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  # ROADMAP.md §P4.2 : budget perf Lighthouse (mobile, throttling
  # simulé) sur les pages clés. `ubuntu-latest` fournit Chrome stable
  # pré-installé (auto-détecté par chrome-launcher, pas de CHROME_PATH à
  # poser). Informatif seulement — LCP < 2.5 s / CLS < 0.1 en warning, jamais
  # bloquant (cf. scripts/lighthouse-report.mjs) : même posture que ZAP/k6
  # ci-dessus, seuils pas encore calibrés sur un vrai run.
  lighthouse:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: darna
          POSTGRES_USER: darna
          POSTGRES_PASSWORD: darna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darna"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://darna:darna@localhost:5432/darna
      DIRECT_URL: postgresql://darna:darna@localhost:5432/darna
      AUTH_SECRET: ci-only-dummy-secret-do-not-use-in-prod
      SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed (pages avec du contenu réel à auditer)
        run: npx prisma db seed

      - name: Build (production — perf réelle, pas next dev)
        run: npm run build

      - name: Démarrer le serveur en arrière-plan
        run: |
          nohup npx next start > next-start.log 2>&1 &
          echo $! > server.pid

      - name: Attendre que le serveur soit prêt
        run: |
          for i in $(seq 1 30); do
            if curl -sS -o /dev/null http://localhost:3000; then
              echo "Serveur prêt."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Le serveur next start n'a jamais répondu."
          cat next-start.log
          exit 1

      - name: Lighthouse (Accueil, Recherche, Annonce)
        if: always()
        run: |
          SLUG=$(npx tsx scripts/print-sample-property-slug.ts)
          node scripts/lighthouse-report.mjs http://localhost:3000 "$SLUG"

      - name: Arrêter le serveur
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  # TEST_AUTOMATION_ROADMAP.md §6.7 : perf/charge k6. Runner GitHub Actions
  # partagé = pas un environnement stable pour un gate bloquant par PR — jamais
  # sur push/pull_request, uniquement ici (nightly) ou déclenchement manuel.
  perf:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: darna
          POSTGRES_USER: darna
          POSTGRES_PASSWORD: darna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darna"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://darna:darna@localhost:5432/darna
      DIRECT_URL: postgresql://darna:darna@localhost:5432/darna
      AUTH_SECRET: ci-only-dummy-secret-do-not-use-in-prod
      SITE_URL: http://localhost:3000
      KYC_GATING: "off"
      CAPTCHA_MODE: "off"
      BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Install Playwright (Chromium)
        # booking-load-setup.ts se connecte via l'UI réelle (login), pas de
        # navigateur nécessaire pour search.js.
        run: npx playwright install --with-deps chromium

      - name: Démarrer le serveur (arrière-plan)
        run: nohup npm run dev > /tmp/dev.log 2>&1 &

      - name: Attendre la disponibilité du serveur
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 2
          done
          echo "Serveur non prêt après 60s"
          cat /tmp/dev.log
          exit 1

      - name: k6 — recherche (/sejours)
        id: perf_search
        run: npm run test:perf 2>&1 | tee /tmp/k6-search.log

      - name: k6 — charge sur la réservation concurrente
        id: perf_booking
        run: npm run test:perf:booking 2>&1 | tee /tmp/k6-booking.log

      - name: Résumé (page du run)
        if: always()
        run: |
          {
            echo "## 🚦 Rapport perf (k6)"
            echo ""
            echo "### Recherche (/sejours)"
            echo '```'
            tail -30 /tmp/k6-search.log
            echo '```'
            echo ""
            echo "### Charge — réservation concurrente"
            echo '```'
            tail -30 /tmp/k6-booking.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ROADMAP.md §P5.6 : SBOM (inventaire des dépendances, CycloneDX via
  # `npm sbom` — natif npm ≥ 9.7, zéro dépendance ajoutée, cf. l'esprit
  # « zéro dépendance » de scripts/check-destructive-migrations.mjs) + scan
  # de vulnérabilités de la chaîne d'approvisionnement (Trivy). Complète
  # `npm audit --audit-level=high` (déjà bloquant dans `full`, ci.yml) par un
  # scan plus large (composants transitifs, format standard exploitable par
  # un outil tiers). Nightly comme semgrep/ZAP/k6 ci-dessus, jamais sur
  # push/pull_request. Informatif pour ce premier run (même posture que
  # ZAP/Lighthouse à leur introduction, cf. commentaires ci-dessus) : seuils
  # pas encore calibrés sur un vrai résultat de CE dépôt — à rendre bloquant
  # une fois le premier rapport lu.
  sbom-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Générer le SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx > sbom.cyclonedx.json

      - name: Upload SBOM (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 14

      - name: Trivy — scan de vulnérabilités (chaîne d'approvisionnement)
        # exit-code 0 volontaire (informatif) : premier run réel sur ce
        # dépôt, seuils non calibrés — voir commentaire du job ci-dessus.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          output: trivy-report.txt
          exit-code: "0"

      - name: Rapport Trivy (page du run)
        if: always()
        run: |
          {
            echo "## 🔎 Rapport Trivy (chaîne d'approvisionnement)"
            echo ""
            if [ -f trivy-report.txt ]; then
              echo '```'
              cat trivy-report.txt
              echo '```'
            else
              echo "Rapport introuvable — voir les logs du step Trivy ci-dessus."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
