name: ZAP baseline (DAST)

# TEST_AUTOMATION_ROADMAP.md §6.6/§7.2/§8 Phase 5 : scan PASSIF OWASP ZAP
# (headers/CSP/cookies) — vérifie en boîte noire ce que §1 de QA_ROADMAP.md
# affirme déjà en code (CSP par nonce, HSTS, X-Frame-Options DENY, nosniff).
# JAMAIS sur push/pull_request : workflow séparé de ci.yml (même choix que
# perf.yml), pas un `if:` sur un trigger partagé — zéro risque de
# déclenchement accidentel sur une PR. Nightly/hebdo + workflow_dispatch.
on:
  schedule:
    - cron: "0 4 * * 1" # lundi 04:00 UTC
  workflow_dispatch:

jobs:
  zap-baseline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: darna
          POSTGRES_USER: darna
          POSTGRES_PASSWORD: darna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darna"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://darna:darna@localhost:5432/darna
      DIRECT_URL: postgresql://darna:darna@localhost:5432/darna
      AUTH_SECRET: ci-only-dummy-secret-do-not-use-in-prod
      SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed (pages avec du contenu réel à scanner)
        run: npx prisma db seed

      - name: Build (production — headers/CSP réels, pas next dev)
        run: npm run build

      - name: Démarrer le serveur en arrière-plan
        run: |
          nohup npx next start > next-start.log 2>&1 &
          echo $! > server.pid

      - name: Attendre que le serveur soit prêt
        run: |
          for i in $(seq 1 30); do
            if curl -sS -o /dev/null http://localhost:3000; then
              echo "Serveur prêt."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Le serveur next start n'a jamais répondu."
          cat next-start.log
          exit 1

      - name: ZAP baseline scan
        # continue-on-error : le 1er run réel (2026-07-20) a montré que le
        # SCAN lui-même aboutit et écrit ses rapports (report_html.html/
        # report_json.json/report_md.md à la racine — noms désormais
        # confirmés, plus une supposition) sans AUCUN souci — 387 URLs,
        # 0 FAIL, 59 PASS, 8 catégories WARN — mais que l'étape échoue quand
        # même à cause de l'upload d'artifact INTERNE à l'action ("Create
        # Artifact Container failed... is not valid"), qui cible l'ancienne
        # API Actions Artifacts (v1/v2, api-version=6.0-preview) que GitHub a
        # dépréciée côté serveur — indépendant de fail_action (qui ne gouverne
        # que les findings WARN/FAIL, pas cette erreur d'upload). On ne
        # dépend plus de son upload interne : on récupère les fichiers
        # nous-mêmes juste après, avec actions/upload-artifact@v4 (l'API
        # actuelle, déjà éprouvée dans ci.yml).
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:3000"
          # Scan PASSIF uniquement (aucune attaque active) — cf. roadmap
          # "DAST (Beta+) : scan passif". fail_action=false : seuils/faux
          # positifs pas encore calibrés sur un vrai résultat — un rapport à
          # examiner, pas un gate bloquant (le job entier ne tourne de toute
          # façon jamais sur PR, cf. `on:` ci-dessus).
          fail_action: false
          allow_issue_writing: false

      - name: Rapport ZAP (page du run)
        if: always()
        run: |
          {
            echo "## 🛡️ Rapport ZAP baseline (DAST)"
            echo ""
            if [ -f report_md.md ]; then
              cat report_md.md
            else
              echo "Rapport Markdown introuvable à la racine — voir l'artifact \`zap-report\` (HTML/JSON complets) ou les logs du step \`ZAP baseline scan\` ci-dessus."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rapport ZAP (artifact)
        # Upload par nous-mêmes (API actuelle) plutôt que de dépendre de
        # l'upload interne cassé de l'action — cf. commentaire ci-dessus.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn
          retention-days: 14

      - name: Arrêter le serveur
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
