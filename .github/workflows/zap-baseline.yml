name: ZAP baseline (DAST)

# TEST_AUTOMATION_ROADMAP.md §6.6/§7.2/§8 Phase 5 : scan PASSIF OWASP ZAP
# (headers/CSP/cookies) — vérifie en boîte noire ce que §1 de QA_ROADMAP.md
# affirme déjà en code (CSP par nonce, HSTS, X-Frame-Options DENY, nosniff).
# JAMAIS sur push/pull_request : workflow séparé de ci.yml (même choix que
# k6-load.yml), pas un `if:` sur un trigger partagé — zéro risque de
# déclenchement accidentel sur une PR. Nightly/hebdo + workflow_dispatch.
on:
  schedule:
    - cron: "0 4 * * 1" # lundi 04:00 UTC (décalé du job k6, 03:00, même service Postgres)
  workflow_dispatch:

jobs:
  zap-baseline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: darna
          POSTGRES_USER: darna
          POSTGRES_PASSWORD: darna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darna"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://darna:darna@localhost:5432/darna
      DIRECT_URL: postgresql://darna:darna@localhost:5432/darna
      AUTH_SECRET: ci-only-dummy-secret-do-not-use-in-prod
      SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed (pages avec du contenu réel à scanner)
        run: npx prisma db seed

      - name: Build (production — headers/CSP réels, pas next dev)
        run: npm run build

      - name: Démarrer le serveur en arrière-plan
        run: |
          nohup npx next start > next-start.log 2>&1 &
          echo $! > server.pid

      - name: Attendre que le serveur soit prêt
        run: |
          for i in $(seq 1 30); do
            if curl -sS -o /dev/null http://localhost:3000; then
              echo "Serveur prêt."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Le serveur next start n'a jamais répondu."
          cat next-start.log
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:3000"
          # Scan PASSIF uniquement (aucune attaque active) — cf. roadmap
          # "DAST (Beta+) : scan passif". fail_action=false : premier run
          # jamais exécuté avant sur ce site, seuils/faux positifs pas encore
          # calibrés — un rapport à examiner, pas un gate bloquant (le job
          # entier ne tourne de toute façon jamais sur PR, cf. `on:` ci-dessus).
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-report

      - name: Rapport ZAP (page du run)
        # Défensif sur le nom exact du fichier Markdown généré par l'action
        # (non vérifié en amont — cf. TEST_AUTOMATION_ROADMAP.md §6.6, limite
        # de validation documentée) : essaie les noms usuels, sinon renvoie
        # vers l'artifact/les logs plutôt que d'échouer.
        if: always()
        run: |
          {
            echo "## 🛡️ Rapport ZAP baseline (DAST)"
            echo ""
            report=$(ls report_md.md zap_scan/report_md.md 2>/dev/null | head -1)
            if [ -n "$report" ]; then
              cat "$report"
            else
              echo "Rapport Markdown non trouvé au chemin attendu — voir l'artifact \`zap-report\` (HTML/JSON complets) ou les logs du step \`ZAP baseline scan\` ci-dessus."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Arrêter le serveur
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
